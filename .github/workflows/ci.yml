name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test

  matrix:
    name: Generate and boot
    runs-on: ubuntu-latest
    # A generated project that does not run is the only failure that matters here, and it takes
    # an install per case — so it runs after the unit tests have had their cheap say.
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        case: [workers-full, workers-studio, workers-api, node-full, node-studio, node-api, node-postgres, node-s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build

      # Only the S3 case needs an endpoint, and the bucket is created by the smoke script
      # itself, signing from this repo's own aws4fetch devDependency.
      #
      # MinIO used to play this part, then lost its distribution under everyone in three
      # installments: Docker Hub dropped the images, quay.io fenced them behind auth, and
      # dl.min.io — the download server — went 410 the same month. The last one turned CI red
      # on a day when nothing here had changed. So the endpoint is now a Node module: the
      # smoke runs Node already, and s3rver cannot be pulled out from under it the way an
      # image registry can. It authenticates against its one built-in account, access key
      # S3RVER (lib/models/account.js; no option changes it — the constructor field for
      # credentials is silently dropped), so the smoke signs as that key through the S3_*
      # overrides exported below. The minioadmin defaults stay for a real MinIO behind
      # S3_ENDPOINT.
      - name: Start S3 (s3rver)
        if: matrix.case == 'node-s3'
        run: |
          # s3rver does not create its directory, not even one level; on a fresh runner
          # $RUNNER_TEMP exists but s3-data does not, and without this the probe loop burns
          # 30 seconds on HTTP 500 and the step dies after them.
          mkdir -p "$RUNNER_TEMP/s3-data"
          nohup node -e "new (require('s3rver'))({ address: '127.0.0.1', port: 9000, directory: '$RUNNER_TEMP/s3-data', silent: true }).run()" > "$RUNNER_TEMP/s3rver.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/ | grep -q ListAllMyBuckets && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/ | grep -q ListAllMyBuckets
          echo "S3_ACCESS_KEY_ID=S3RVER" >> "$GITHUB_ENV"
          echo "S3_SECRET_ACCESS_KEY=S3RVER" >> "$GITHUB_ENV"

      - run: node scripts/smoke.mjs --only=${{ matrix.case }}
