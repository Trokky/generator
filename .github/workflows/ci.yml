name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test

  matrix:
    name: Generate and boot
    runs-on: ubuntu-latest
    # A generated project that does not run is the only failure that matters here, and it takes
    # an install per case — so it runs after the unit tests have had their cheap say.
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        case: [workers-full, workers-studio, workers-api, node-full, node-studio, node-api, node-postgres, node-s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build

      # Only the S3 case needs one, and a service container cannot override an image's command —
      # which MinIO needs — so it is started as a step instead. The bucket is created by the
      # smoke script itself, with the generated project's own signing library.
      #
      # quay.io, not Docker Hub: MinIO's images are no longer published there (`minio/minio`
      # 404s, and so does `minio/mc`). A local `docker run minio/minio` can still succeed from
      # a cached layer, which is exactly how this reached CI unnoticed.
      - name: Start MinIO
        if: matrix.case == 'node-s3'
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/minio/health/live

      - run: node scripts/smoke.mjs --only=${{ matrix.case }}
